
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মানবতার বন্ধন - রক্তদাতা নিবন্ধন</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    .header {
      background: #c62828;
      color: white;
      padding: 35px 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin-bottom: 0;
    }

    .container {
      max-width: 550px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .blood {
      font-size: 55px;
    }

    h2 {
      color: #c62828;
    }

    .register-btn {
      display: inline-block;
      background: #c62828;
      color: white;
      padding: 15px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
    }

    .register-btn:hover {
      background: #a31515;
    }

    .footer {
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🩸 মানবতার বন্ধন</h1>
    <p>রক্ত দিন, জীবন বাঁচান</p>
  </div>

  <div class="container">
    <div class="blood">🩸</div>

    <h2>রক্তদাতা নিবন্ধন করুন</h2>

    <p>
      আপনার এক ব্যাগ রক্ত বাঁচাতে পারে একটি মূল্যবান প্রাণ।
      রক্তদাতা হিসেবে নিবন্ধন করে মানবতার পাশে দাঁড়ান।
    </p>

    <a
      class="register-btn"
      href="https://docs.google.com/forms/d/e/1FAIpQLSe0gwLc0ow05nfvrhzc-erZFXDCfcUuDDStGPFKNMP6W_26aw/viewform"
      target="_blank"
      rel="noopener noreferrer">
      রক্তদাতা হিসেবে নিবন্ধন করুন
    </a>
  </div>

  <div class="footer">
    © 2026 মানবতার বন্ধন | মানবতার সেবায় আমরা
  </div>

</body>
</html>
