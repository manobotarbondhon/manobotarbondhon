<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>মানবতার বন্ধন | Manobotar Bondhon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#fff8f8;
    color:#292929;
    line-height:1.6;
}

/* ================= HEADER ================= */

header{
    background:linear-gradient(135deg,#b90024,#8b001c);
    color:white;
    padding:25px 15px 22px;
    text-align:center;
}

.logo-image{
    display:block;
    width:120px;
    max-width:45%;
    height:auto;
    margin:0 auto 12px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

header p{
    margin-top:5px;
    font-size:14px;
}

.tagline{
    font-size:15px;
    opacity:.95;
}

/* ================= NAVIGATION ================= */

nav{
    background:#720018;
    padding:12px 8px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px #00000020;
}

nav a{
    color:white;
    text-decoration:none;
    margin:4px 7px;
    font-size:14px;
    display:inline-block;
    padding:6px 5px;
}

nav a:hover{
    color:#ffd9df;
}

/* ================= HERO ================= */

.hero{
    text-align:center;
    padding:65px 18px;
    background:
    linear-gradient(135deg,#ffe0e5,#ffffff 55%,#fff1f3);
}

.hero h1{
    color:#b90024;
    font-size:34px;
    margin-bottom:15px;
}

.hero p{
    line-height:1.9;
    font-size:16px;
    max-width:700px;
    margin:auto;
}

.btn{
    display:inline-block;
    background:linear-gradient(135deg,#c0002b,#a40025);
    color:white;
    border:none;
    padding:13px 23px;
    border-radius:8px;
    margin-top:22px;
    font-size:16px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 5px 14px #b9002430;
}

.btn:hover{
    opacity:.9;
    transform:translateY(-1px);
}

/* ================= SECTIONS ================= */

section{
    padding:45px 18px;
    max-width:900px;
    margin:auto;
}

h2{
    color:#b90024;
    text-align:center;
    margin-bottom:25px;
    font-size:25px;
}

.search-box,
.form-box,
.donation-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 25px #00000012;
    border:1px solid #f2dddd;
}

input,
select{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#b90024;
    box-shadow:0 0 0 3px #b9002412;
}

label{
    font-weight:bold;
    font-size:14px;
}

.note{
    text-align:center;
    line-height:1.8;
    font-size:14px;
    color:#666;
}

/* ================= FEATURES ================= */

.features{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.feature{
    background:white;
    padding:25px 12px;
    border-radius:13px;
    text-align:center;
    box-shadow:0 4px 16px #00000010;
    border:1px solid #f1dddd;
    transition:.2s;
}

.feature:hover{
    transform:translateY(-3px);
}

.feature span{
    font-size:34px;
}

.feature h3{
    color:#b90024;
    margin-top:10px;
    font-size:16px;
}

/* ================= REGISTRATION ================= */

.registration-info{
    background:#fff5f6;
    border-left:4px solid #b90024;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

.registration-info p{
    font-size:14px;
    color:#555;
}

/* ================= DONATION ================= */

.amount-options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:15px 0 22px;
}

.amount-option{
    display:block;
    border:1px solid #ddd;
    border-radius:8px;
    padding:14px;
    text-align:center;
    cursor:pointer;
    font-size:17px;
    color:#b90024;
    background:#fffafa;
}

.amount-option input{
    width:auto;
    margin:0 5px 0 0;
}

.amount-option:hover{
    border-color:#b90024;
    background:#fff3f5;
}

.payment-info{
    background:#fff5f6;
    padding:18px;
    border-radius:9px;
    margin-top:15px;
    line-height:2;
}

.payment-info h3{
    color:#b90024;
    margin-bottom:8px;
}

.payment-account{
    border-bottom:1px solid #eee;
    padding:10px 0;
}

/* ================= CONTACT ================= */

.contact-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.contact-card{
    background:white;
    padding:22px 15px;
    text-align:center;
    border-radius:13px;
    box-shadow:0 4px 16px #00000010;
    border:1px solid #f1dddd;
}

.contact-card .icon{
    font-size:30px;
}

.contact-card h3{
    color:#b90024;
    margin:8px 0;
}

.contact-card a{
    color:#333;
    text-decoration:none;
    font-weight:bold;
}

/* ================= FOOTER ================= */

footer{
    background:#85001b;
    color:white;
